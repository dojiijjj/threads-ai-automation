<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101010">
<title>Threads 제휴 마케팅 자동화</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0d0d0f;color:#f5f5f5;font-family:system-ui,-apple-system,sans-serif}
main{max-width:760px;margin:auto;padding:22px 16px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:24px}
.brand{font-size:22px;font-weight:800}
.status{font-size:12px;color:#aaa;border:1px solid #333;border-radius:30px;padding:7px 10px}
.card{background:#18181b;border:1px solid #29292e;border-radius:18px;padding:17px;margin:14px 0}
h2{font-size:17px;margin:0 0 14px}
label{display:block;color:#aaa;font-size:13px;margin:12px 0 7px}
input,textarea,select{width:100%;border:1px solid #39393f;background:#101012;color:white;border-radius:11px;padding:12px;font:inherit}
textarea{min-height:165px;resize:vertical;line-height:1.55}
button{border:0;border-radius:11px;padding:12px 15px;background:#fff;color:#111;font-weight:750;font-size:14px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
button.secondary{background:#303036;color:#fff}
button.danger{background:#492326;color:#ffd9dc}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button{flex:1}
.muted{color:#999;font-size:12px;line-height:1.5}
.item{border-top:1px solid #303036;padding:13px 0}
.item p{white-space:pre-wrap;line-height:1.5;margin:7px 0;overflow-wrap:anywhere}
.pill{font-size:11px;color:#bbb}
.tabs{display:flex;gap:8px;margin-bottom:15px}
.tabs button{flex:1}
.hidden{display:none!important}
#linkInfo{color:#b8d5ff;font-size:12px;line-height:1.5;margin-top:8px;overflow-wrap:anywhere}
</style>
<script src="/app.js?v=15" defer></script>
</head>
<body>
<main>
  <div class="top"><div class="brand">◉ Threads 제휴 자동화</div><div class="status" id="status">화면 준비 중</div></div>

  <div class="card">
    <h2>콘텐츠 종류</h2>
    <label for="category">어떤 글을 만들까요?</label>
    <select id="category">
      <option value="toss">토스 쉐어링크 상품 소개</option>
      <option value="daily">일상·정보 게시글</option>
    </select>

    <div id="affiliateWrap">
      <label id="affiliateLabel" for="affiliateLink">토스 쉐어링크</label>
      <input id="affiliateLink" type="text">
      <div class="actions"><button class="secondary" id="linkPreview" type="button">링크에서 상품 정보 가져오기</button></div>
      <div id="linkInfo"></div>
    </div>

    <label id="topicLabel" for="topic">상품명</label>
    <input id="topic">

    <label for="tone">글 말투</label>
    <select id="tone">
      <option>생활형 후기형</option>
      <option>더 유머러스한 생활형</option>
      <option>담백한 추천형</option>
    </select>

    <div class="actions">
      <button id="generate" type="button">AI 글 생성</button>
      <button id="todayIssue" class="secondary hidden" type="button">오늘의 이슈</button>
      <button id="todayDaily" class="secondary hidden" type="button">오늘의 일상</button>
    </div>
    <label for="post">게시글 본문</label>
    <textarea id="post"></textarea>
    <label for="comment">게시 후 첫 댓글</label>
    <textarea id="comment" style="min-height:110px"></textarea>
    <div class="actions">
      <button id="publish" type="button">게시글 + 댓글 등록</button>
      <button class="secondary" id="showSchedule" type="button">게시글 + 댓글 예약</button>
    </div>
    <div id="scheduleBox" class="hidden">
      <label for="when">게시 예약 시간</label>
      <input id="when" type="datetime-local">
      <div class="actions"><button id="schedule" type="button">예약 등록</button></div>
    </div>
    <p class="muted" id="message" role="status"></p>
  </div>

  <div class="card">
    <div class="tabs">
      <button class="secondary" id="historyTab" type="button">게시 기록</button>
      <button class="secondary" id="scheduledTab" type="button">예약 목록</button>
    </div>
    <div id="list"></div>
  </div>

</main>
</body>
</html>
