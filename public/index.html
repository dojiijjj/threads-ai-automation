<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Google SEO 상품 블로그 자동작성</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101116;color:#f5f5f7;font-family:system-ui,-apple-system,sans-serif}
main{max-width:780px;margin:auto;padding:22px 15px 55px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:20px}
.brand{font-size:20px;font-weight:850}
.status{font-size:11px;color:#aaa;border:1px solid #363741;border-radius:30px;padding:7px 10px;white-space:nowrap}
.card{background:#1a1c23;border:1px solid #30323c;border-radius:17px;padding:16px;margin:13px 0}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:14px;margin:18px 0 9px}
label{display:block;color:#b5b6c0;font-size:13px;margin:12px 0 7px}
input,textarea{width:100%;border:1px solid #41434f;background:#111319;color:#fff;border-radius:10px;padding:12px;font:inherit}
textarea{min-height:420px;line-height:1.75;resize:vertical}
button{border:0;border-radius:11px;padding:13px 14px;background:#e9eaff;color:#171823;font-weight:800;font-size:14px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.secondary{background:#353844;color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button{flex:1}
.muted{font-size:12px;color:#9b9daa;line-height:1.6}
.hidden{display:none!important}
#message{white-space:pre-wrap;color:#c7d2fe;font-size:13px;line-height:1.5;margin-top:12px}
.infoGrid{display:grid;grid-template-columns:92px 1fr;gap:9px 12px;margin-top:12px;font-size:13px;line-height:1.55}
.infoGrid .key{color:#a7a9b4}
.infoGrid .value{color:#f1f1f4;overflow-wrap:anywhere}
.productShots{display:flex;gap:9px;overflow-x:auto;margin-top:13px;padding-bottom:4px}
.productShots img{width:104px;height:104px;object-fit:contain;background:#fff;border-radius:9px;flex:0 0 auto}
.imageGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.imageCard{background:#12141a;border:1px solid #363944;border-radius:12px;overflow:hidden;min-width:0}
.imageCard img{width:100%;height:160px;object-fit:cover;display:block;background:#252832}
.imageCard .meta{padding:10px}
.imageCard .name{font-size:12px;line-height:1.4;font-weight:700;overflow-wrap:anywhere}
.articlePreview{background:#fff;color:#242424;border-radius:12px;padding:16px;line-height:1.85;font-size:14px;overflow-wrap:anywhere}
.articlePreview h1{font-size:21px;color:#111;margin:0 0 18px;line-height:1.4}
.articlePreview h2{font-size:18px;color:#111;margin:22px 0 10px}
.articlePreview p{margin:0 0 15px}
.articlePreview figure{margin:18px 0 24px}
.articlePreview figure img{width:100%;max-height:380px;object-fit:contain;display:block}
.step{display:flex;gap:8px;align-items:center;font-size:12px;color:#aaa;margin-top:8px}
.dot{width:7px;height:7px;border-radius:50%;background:#8192d8;flex:none}
@media(max-width:480px){.imageGrid{grid-template-columns:1fr 1fr}.imageCard img{height:125px}}
</style>
<script src="/app.js?v=6" defer></script>
</head>
<body><main>
<div class="top"><div class="brand">✍️ Google SEO 상품 블로그</div><div class="status" id="status">연결 확인 중</div></div>

<div class="card">
<h2>1. 상품 링크 입력</h2>
<input id="url" type="url" placeholder="상품 상세페이지 URL 붙여넣기">
<div class="actions"><button id="fetchProduct">상품 정보 가져오기</button></div>
<div class="step"><span class="dot"></span><span>먼저 상품 정보만 빠르게 확인한 뒤, 아래 버튼으로 글을 생성합니다.</span></div>
<div id="message" role="status"></div>
</div>

<div id="productPanel" class="card hidden">
<h2>2. 수집된 상품 정보</h2>
<div id="productInfo" class="infoGrid"></div>
<div id="productShots" class="productShots"></div>
<p class="muted" id="productNotice"></p>
<div class="actions"><button id="generate">이 상품으로 글과 사진 생성</button></div>
</div>

<div id="result" class="hidden">
<div class="card">
<h2>3. 구글 SEO 포스팅 결과</h2>
<div id="keywords" class="muted"></div>
<label for="title">추천 제목</label>
<input id="title" type="text">
<label for="body">본문과 해시태그 20개</label>
<textarea id="body"></textarea>
<div class="actions"><button id="copyHtml" class="secondary">글 전체 복사</button><button id="copyText" class="secondary">텍스트 복사</button></div>
</div>
<div class="card">
<h2>자동으로 찾은 관련 사진</h2>
<div id="images" class="imageGrid"></div>
</div>
<div class="card">
<h2>최종 글 미리보기</h2>
<div id="articlePreview" class="articlePreview"></div>
<div class="actions"><button id="toTistory">티스토리 글쓰기 열고 글 옮기기</button></div>
<p class="muted">버튼을 누르면 글 전체를 서식 포함 HTML로 복사하고 티스토리 글쓰기 화면을 엽니다. 티스토리 편집기에 붙여넣은 뒤 게시 버튼만 누르면 됩니다.</p>
</div>
</div>
</main></body></html>
