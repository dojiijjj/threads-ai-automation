<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<title>Google SEO 상품 블로그 자동작성</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101116;color:#f5f5f7;font-family:system-ui,-apple-system,sans-serif}
main{max-width:780px;margin:auto;padding:22px 15px 55px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:20px}
.brand{font-size:20px;font-weight:850}
.status{font-size:11px;color:#aaa;border:1px solid #363741;border-radius:30px;padding:7px 10px;white-space:nowrap}
.card{background:#1a1c23;border:1px solid #30323c;border-radius:17px;padding:16px;margin:13px 0}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:14px;margin:18px 0 9px}
label{display:block;color:#b5b6c0;font-size:13px;margin:12px 0 7px}
input,textarea{width:100%;border:1px solid #41434f;background:#111319;color:#fff;border-radius:10px;padding:12px;font:inherit}
.articleEditor{background:#fff;color:#242424;border:1px solid #41434f;border-radius:10px;padding:16px;min-height:560px;line-height:1.85;font-size:14px;overflow-wrap:anywhere;outline:none}
.articleEditor:focus{border-color:#9da8f3}
.articleEditor h2{font-size:18px;color:#111;margin:22px 0 10px}
.articleEditor p{margin:0 0 15px}
.articleEditor figure{margin:18px 0 24px;text-align:center}
.articleEditor figure img{width:100%;height:auto;max-height:420px;object-fit:contain;display:block}
.articleEditor .hashtags{margin-top:24px;padding-top:12px;border-top:1px solid #eee;font-size:13px;color:#555}
button{border:0;border-radius:11px;padding:13px 14px;background:#e9eaff;color:#171823;font-weight:800;font-size:14px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.secondary{background:#353844;color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button{flex:1}
.muted{font-size:12px;color:#9b9daa;line-height:1.6}
.hidden{display:none!important}
#message{white-space:pre-wrap;color:#c7d2fe;font-size:13px;line-height:1.5;margin-top:12px}
.infoGrid{display:grid;grid-template-columns:92px 1fr;gap:9px 12px;margin-top:12px;font-size:13px;line-height:1.55}
.infoGrid .key{color:#a7a9b4}
.infoGrid .value{color:#f1f1f4;overflow-wrap:anywhere}
.step{display:flex;gap:8px;align-items:center;font-size:12px;color:#aaa;margin-top:8px}
.dot{width:7px;height:7px;border-radius:50%;background:#8192d8;flex:none}
</style>
<script src="/app.js?v=11" defer></script>
</head>
<body><main>
<div class="top"><div class="brand">✍️ Google SEO 상품 블로그</div><div class="status" id="status">연결 확인 중</div></div>

<div class="card">
<h2>1. 상품 링크 입력</h2>
<input id="url" type="url" placeholder="상품 상세페이지 URL 붙여넣기">
<div class="actions"><button id="fetchProduct">상품 정보 가져오기</button></div>
<div class="step"><span class="dot"></span><span>상품페이지 대표 이미지만 사용하며 별도 사진 검색은 하지 않습니다.</span></div>
<div id="message" role="status"></div>
</div>

<div id="productPanel" class="card hidden">
<h2>2. 수집된 상품 정보</h2>
<div id="productInfo" class="infoGrid"></div>
<p class="muted" id="productNotice"></p>
<div class="actions"><button id="generate">이 상품으로 글과 사진 생성</button></div>
</div>

<div id="result" class="hidden">
<div class="card">
<h2>3. 완성된 글</h2>
<label for="title">제목</label>
<input id="title" type="text">
<label for="articleEditor">본문과 사진이 함께 들어간 편집 영역</label>
<div id="articleEditor" class="articleEditor" contenteditable="true" spellcheck="false" aria-label="본문과 사진 편집 영역"></div>
<div class="actions">
<button id="copyHtml" class="secondary">티스토리 HTML 코드 복사</button>
<button id="copyText" class="secondary">텍스트 복사</button>
<button id="toTistory">티스토리 글쓰기 열기</button>
</div>
<p class="muted">본문과 사진은 위 한 칸에서 함께 수정할 수 있어. 티스토리에서는 기본모드를 HTML로 전환한 뒤 HTML 코드를 붙여넣고, 다시 기본모드로 돌아오면 사진이 보여. 제목은 제목 칸에 따로 입력해 줘. 사진은 이 프로그램의 이미지 주소를 통해 표시돼.</p>
</div>
</div>
</main></body></html>
