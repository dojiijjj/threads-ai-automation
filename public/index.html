<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111318">
<meta name="description" content="상품과 기사 링크로 SEO 블로그 글과 사진을 만드는 도구">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="블로그 자동작성">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Google SEO 상품 블로그 자동작성</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101116;color:#f5f5f7;font-family:system-ui,-apple-system,sans-serif}
main{max-width:780px;margin:auto;padding:22px 15px 55px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:20px}
.brand{font-size:20px;font-weight:850}
.status{font-size:11px;color:#aaa;border:1px solid #363741;border-radius:30px;padding:7px 10px;white-space:nowrap}
.card{background:#1a1c23;border:1px solid #30323c;border-radius:17px;padding:16px;margin:13px 0}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:14px;margin:18px 0 9px}
label{display:block;color:#b5b6c0;font-size:13px;margin:12px 0 7px}
input,textarea{width:100%;border:1px solid #41434f;background:#111319;color:#fff;border-radius:10px;padding:12px;font:inherit}
.articleEditor{background:#fff;color:#242424;border:1px solid #41434f;border-radius:10px;padding:16px;min-height:560px;line-height:1.85;font-size:14px;overflow-wrap:anywhere;outline:none}
.articleEditor:focus{border-color:#9da8f3}
.articleEditor h2{font-size:18px;color:#111;margin:22px 0 10px}
.articleEditor p{margin:0 0 15px}
.articleEditor figure{margin:18px 0 24px;text-align:center}
.articleEditor figure img{width:100%;height:auto;max-height:420px;object-fit:contain;display:block}
.articleEditor .hashtags{margin-top:24px;padding-top:12px;border-top:1px solid #eee;font-size:13px;color:#555}
button{border:0;border-radius:11px;padding:13px 14px;background:#e9eaff;color:#171823;font-weight:800;font-size:14px;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
.secondary{background:#353844;color:#fff}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.actions button{flex:1}
.muted{font-size:12px;color:#9b9daa;line-height:1.6}
.hidden{display:none!important}
#message{white-space:pre-wrap;color:#c7d2fe;font-size:13px;line-height:1.5;margin-top:12px}
.infoGrid{display:grid;grid-template-columns:92px 1fr;gap:9px 12px;margin-top:12px;font-size:13px;line-height:1.55}
.infoGrid .key{color:#a7a9b4}
.infoGrid .value{color:#f1f1f4;overflow-wrap:anywhere}
.step{display:flex;gap:8px;align-items:center;font-size:12px;color:#aaa;margin-top:8px}
.dot{width:7px;height:7px;border-radius:50%;background:#8192d8;flex:none}
.checkLine{display:flex;align-items:center;gap:9px;margin:12px 0 4px;color:#b5b6c0;font-size:13px}
.checkLine input{width:18px;height:18px;margin:0;padding:0;accent-color:#e9eaff;flex:none}
.embedCard h2{margin-bottom:12px}
.embedFrame{display:block;width:100%;height:620px;border:1px solid #41434f;border-radius:12px;background:#fff}
.embedFallback{display:flex;justify-content:flex-end;margin-top:10px;font-size:13px}
.embedFallback a{color:#c7d2fe;text-decoration:none}
.embedOpen{display:block;text-align:center;text-decoration:none;background:#e9eaff;color:#171823;font-weight:800;font-size:14px;border-radius:11px;padding:13px 14px;margin:0 0 10px}
.embedNotice{font-size:12px;line-height:1.6;color:#b5b6c0;margin:0 0 10px}
@media(max-width:520px){.embedFrame{height:560px}}

</style>
<script src="/app.js?v=15" defer></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
}
</script>
</head>
<body><main>
<div class="top"><div class="brand">✍️ Google SEO 상품 블로그</div><div class="status" id="status">연결 확인 중</div></div>

<div class="card">
<h2>1. 상품 링크 입력</h2>
<input id="url" type="url" placeholder="상품 상세페이지 URL 붙여넣기">
<div class="actions"><button id="fetchProduct">상품 정보 가져오기</button></div>
<h2 style="margin-top:22px">기사 링크 입력</h2>
<input id="articleUrl" type="url" placeholder="기사 URL 붙여넣기">
<label class="checkLine"><input id="articleImagesAuthorized" type="checkbox"><span>기사 사진 사용 권한 있음</span></label>
<div class="actions"><button id="fetchArticle">기사 정보 가져오기</button></div>
<div id="message" role="status"></div>
</div>

<section class="card embedCard">
<h2>네이버 엔터</h2>
<a class="embedOpen" href="https://share.google/vBkwNtSLNiz1RFadi" target="_blank" rel="noopener noreferrer">네이버 엔터 새 탭으로 열기</a>
<p class="embedNotice">기사 상세 페이지는 네이버 보안 정책으로 앱 안에서 열리지 않을 수 있어요. 기사 보기는 위 버튼으로 새 탭을 열어 이용해 주세요.</p>
<iframe class="embedFrame" src="https://share.google/vBkwNtSLNiz1RFadi" title="네이버 엔터 미리보기" loading="lazy" referrerpolicy="no-referrer" allowfullscreen></iframe>
<div class="embedFallback"><a href="https://share.google/vBkwNtSLNiz1RFadi" target="_blank" rel="noopener noreferrer">새 탭으로 다시 열기</a></div>
</section>

<div id="productPanel" class="card hidden">
<h2>2. 수집된 상품 정보</h2>
<div id="productInfo" class="infoGrid"></div>
<div class="actions"><button id="generate">이 상품으로 글과 사진 생성</button></div>
</div>

<div id="articlePanel" class="card hidden">
<h2>기사 정보</h2>
<div id="articleInfo" class="infoGrid"></div>
<div class="actions"><button id="generateArticle">이 기사로 글과 사진 생성</button></div>
</div>

<div id="result" class="hidden">
<div class="card">
<h2>3. 완성된 글</h2>
<label for="title">제목</label>
<input id="title" type="text">
<label for="articleEditor">본문과 사진이 함께 들어간 편집 영역</label>
<div id="articleEditor" class="articleEditor" contenteditable="true" spellcheck="false" aria-label="본문과 사진 편집 영역"></div>
<div class="actions">
<button id="copyHtml" class="secondary">티스토리 HTML 코드 복사</button>
<button id="copyText" class="secondary">제목 복사</button>
<button id="toTistory">티스토리 글쓰기 열기</button>
</div>
</div>
</div>
</main></body></html>
